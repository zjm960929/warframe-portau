<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Portau 波陶</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <img class="bg-img" src="images/bg.jpg" alt="">
  <div class="bg-scrim"></div>
  <audio id="bgm-audio" src="audio/bgm.mp3" loop preload="none"></audio>

  <!-- ========== 主菜单 ========== -->
  <div class="screen" id="screen-menu">
    <div class="hero">
      <div class="title">POR<span class="title-tau">τ</span>AU 波陶</div>
      <div class="deco-line"></div>
    </div>
    <div class="panel">
      <div class="section-label">选择难度</div>
      <div class="diff-row">
        <div class="diff-item" data-d="easy"><div class="diff-name">简单</div></div>
        <div class="diff-item active" data-d="normal"><div class="diff-name">普通</div></div>
        <div class="diff-item" data-d="hard"><div class="diff-name">困难</div></div>
      </div>
      <button class="btn primary" id="btn-start">开始对局</button>
      <button class="btn ghost" id="btn-rules">规则说明</button>
      <button class="btn ghost" id="btn-bgm">背景音乐：开</button>
      <div class="menu-footer">
        <span class="author">作者：ZJM</span>
        <a class="social" href="https://space.bilibili.com/16730771" target="_blank" rel="noopener" title="哔哩哔哩主页">
          <svg viewBox="0 0 28 24" width="26" height="24" aria-label="bilibili">
            <line x1="8" y1="2" x2="11.2" y2="6.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <line x1="20" y1="2" x2="16.8" y2="6.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <rect x="3" y="6.2" width="22" height="15.6" rx="5.5" fill="none" stroke="currentColor" stroke-width="2.2"/>
            <rect x="9.4" y="11" width="2.7" height="6" rx="1.35" fill="currentColor"/>
            <rect x="15.9" y="11" width="2.7" height="6" rx="1.35" fill="currentColor"/>
          </svg>
        </a>
        <a class="social" href="https://www.douyin.com/user/MS4wLjABAAAAFIQ6-Ww8fODvrsOR2oFTtegpwDnpVq_PKHIUbxkvFSE" target="_blank" rel="noopener" title="抖音主页">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-label="douyin">
            <path fill="currentColor" d="M16.6 3c.4 2.2 1.9 3.8 4.1 4v3.1c-1.6 0-3-.5-4.1-1.4v6.4c0 3.4-2.7 6-6 6s-6-2.6-6-6 2.7-6 6-6c.34 0 .67.03 1 .1v3.3c-.31-.1-.65-.16-1-.16-1.6 0-2.9 1.3-2.9 2.9s1.3 2.9 2.9 2.9 2.9-1.3 2.9-2.9V3h3.1z"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <!-- ========== 对局 ========== -->
  <div class="screen hidden" id="screen-game">
    <div class="topbar">
      <button class="nav-back" id="btn-back" title="返回主界面">‹</button>
      <div class="side-info">
        <span class="who">你</span>
        <span class="score player-score" id="score-player">0</span>
      </div>
      <div class="deck-info" id="deck-box">
        <span class="deck-label">牌堆</span>
        <span class="deck-num" id="deck-num">0</span>
      </div>
      <div class="side-info">
        <span class="who" id="ai-name">魂主（普通）</span>
        <span class="score ai-score" id="score-ai">0</span>
      </div>
    </div>

    <div class="hand-row ai-row" id="ai-hand"></div>

    <div class="board"><div class="board-inner" id="board-inner"></div></div>

    <div class="turnbar"><span id="turn-text" class="turn-me">你的回合</span></div>

    <div class="hand-row player-row" id="player-hand"></div>

    <div class="hint-bar" id="hint"></div>
    <div class="actionbar hidden" id="actionbar">
      <button class="btn ghost mini" id="btn-endturn">结束回合</button>
    </div>

    <!-- 开局抽牌 -->
    <div class="overlay" id="opening-overlay">
      <div class="draw-stage" id="draw-stage">
        <div class="overlay-title">决定先手</div>
        <div class="overlay-sub">点选一张牌，与魂主比大小，点数大者先手</div>
        <div class="pool-row" id="pool-row"></div>
      </div>
      <div class="draw-result" id="draw-result">
        <div class="draw-cards">
          <div class="draw-frame" id="frame-player"></div>
          <span class="vs">VS</span>
          <div class="draw-frame" id="frame-ai"></div>
        </div>
        <div class="draw-msg" id="draw-msg"></div>
      </div>
    </div>

    <!-- 补救弹窗 -->
    <div class="overlay hidden" id="remedy-overlay">
      <div class="modal">
        <div class="modal-title">没有可出的牌</div>
        <div class="modal-sub">选择一个方案</div>
        <button class="btn primary" id="btn-discard">弃 1 摸 1（-2 分）</button>
        <button class="btn ghost" id="btn-redraw">重新摸牌（立即结束回合）</button>
        <button class="btn ghost" id="btn-skip">直接结束回合</button>
      </div>
    </div>

    <!-- 结算 -->
    <div class="overlay hidden" id="result-overlay">
      <div class="modal">
        <div class="result-title" id="result-title">胜利</div>
        <div class="result-score" id="result-score">你 0 : 0 魂主</div>
        <button class="btn primary" id="btn-restart">再来一局</button>
        <button class="btn ghost" id="btn-home">返回首页</button>
      </div>
    </div>
  </div>

  <!-- 规则视频弹窗（B站嵌入） -->
  <div class="overlay hidden" id="rules-overlay">
    <div class="modal wide video-modal">
      <div class="modal-title">规则说明</div>
      <div class="modal-sub">视频来自 B站 @ZJM</div>
      <div class="video-wrap">
        <iframe id="rules-video" src="https://player.bilibili.com/player.html?isOutside=true&aid=117553221341646&bvid=BV191436sE5f&cid=43300489990&p=1&autoplay=0" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>
      </div>
      <button class="btn primary" id="btn-rules-close">关闭</button>
    </div>
  </div>

  <!-- 飞行动画层 -->
  <div id="fly-layer"></div>

  <!-- 竖屏提示（移动端） -->
  <div class="overlay-rotate hidden" id="rotate-overlay">
    <div class="rotate-box">
      <div class="rotate-icon">📱</div>
      <div class="rotate-text">请将设备旋转至横屏游玩</div>
      <div class="rotate-sub">横屏后此提示会自动消失</div>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
